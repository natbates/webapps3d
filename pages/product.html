<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product - Generic Furniture Company</title>
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/products.css" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="shared-nav"></div>
<main class="container py-5">
    <section class="panel panel-viewer">
      <h1 id="modelTitle">Product Viewer</h1>
      <p id="modelDescription">Load a product from the catalog to see it in the 3D viewer.</p>
      <div id="viewer" class="viewer">
        <div class="viewer-overlay">
          <button id="zoomIn" type="button" class="viewer-overlay-button">+</button>
          <button id="zoomOut" type="button" class="viewer-overlay-button">−</button>
          <button id="toggleWireframeOverlay" type="button" class="viewer-overlay-button viewer-overlay-toggle">Wireframe</button>
          <div class="viewer-overlay-group">
            <label for="lightIntensityOverlay">Light</label>
            <input id="lightIntensityOverlay" type="range" min="0" max="3" step="0.05" value="1" class="viewer-overlay-range" />
          </div>
          <div class="viewer-overlay-group viewer-overlay-color">
            <button class="viewer-overlay-swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
            <button class="viewer-overlay-swatch" data-color="#ffe066" style="background:#ffe066" title="Warm"></button>
            <button class="viewer-overlay-swatch" data-color="#80d8ff" style="background:#80d8ff" title="Cool"></button>
            <button class="viewer-overlay-swatch" data-color="#ff8a80" style="background:#ff8a80" title="Accent"></button>
          </div>
        </div>
      </div>
      <div class="viewer-text">Use drag to orbit, pinch or scroll to zoom, and change material finishes below.</div>
    </section>
  </main>

  <div id="shared-footer"></div>
  <script type="module" src="../js/shared-layout.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
