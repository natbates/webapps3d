<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Products - Generic Furniture Company</title>
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/products.css" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body class="product-page">
  <div id="shared-nav"></div>
<main class="container py-5">
    <section class="panel panel-products panel-catalog">
      <div class="product-hero">
        <h1>Our Products</h1>
      </div>

      <div class="product-cards">
        <a class="product-card product-table" href="product.html?product=table">
          <div class="product-image">
            <div class="product-preview" data-product="table"></div>
            <span class="preview-label">Table preview</span>
          </div>
          <div class="product-card-body">
            <h3>Table</h3>
            <p>Interactive table with material preview and model details.</p>
          </div>
        </a>
        <a class="product-card product-chair" href="product.html?product=chair">
          <div class="product-image">
            <div class="product-preview" data-product="chair"></div>
            <span class="preview-label">Chair preview</span>
          </div>
          <div class="product-card-body">
            <h3>Chair</h3>
            <p>Comfortable chair with adjustable lighting and texture options.</p>
          </div>
        </a>
        <a class="product-card product-bench" href="product.html?product=bench">
          <div class="product-image">
            <div class="product-preview" data-product="bench"></div>
            <span class="preview-label">Bench preview</span>
          </div>
          <div class="product-card-body">
            <h3>Bench</h3>
            <p>Elegant bench product page optimized for 3D previewing.</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <div id="shared-footer"></div>
  <script type="module" src="../js/shared-layout.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
